name: upstream-sync
# Keep this fork current with antirez/ds4 WITHOUT ever replacing the pinned
# runtime. On schedule (and on manual dispatch) it fetches upstream/main and
# opens (or updates) a sync PR. It NEVER auto-merges — the PR is for review;
# only then is the runtime pin (DS4_COMMIT) bumped deliberately.

on:
  schedule:
    - cron: '30 4 * * *'        # 04:30 UTC daily (~22:30 MT)
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/antirez/ds4.git
          git fetch upstream main

      - name: Compute divergence
        id: div
        run: |
          echo "behind=$(git rev-list --count main..upstream/main)" >> "$GITHUB_OUTPUT"
          git log --oneline main..upstream/main -n 8 | sed 's/^/  /' > /tmp/log.txt
          { printf '```\n'; cat /tmp/log.txt; printf '```\n'; } > /tmp/body.txt

      - name: Open / update sync PR (never auto-merge)
        if: steps.div.outputs.behind > '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY=$(cat <<EOF
          Upstream \`antirez/ds4\` is ahead by ${{ steps.div.outputs.behind }} commit(s).
          $(cat /tmp/body.txt)
          ---
          This PR is **not auto-merged**. Review it, then bump the runtime pin
          (\`DS4_COMMIT\`) deliberately. Any conflicts must be resolved by hand.
          EOF
          )
          git checkout -b sync/upstream upstream/main || git checkout sync/upstream
          git merge --no-edit origin/main || git merge --abort || true
          git push -f origin sync/upstream
          N=$(gh pr list --head sync/upstream --json number -q '.[0].number')
          if [ -z "$N" ]; then
            gh pr create --base main --head sync/upstream --title "sync: upstream antirez/ds4" --body "$BODY"
          else
            gh pr comment "$N" --body "$BODY"
          fi