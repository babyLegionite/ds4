name: upstream-sync
# Keep this fork current with antirez/ds4 WITHOUT ever replacing the pinned
# runtime. On schedule (Wed + Sun) and on manual dispatch it fetches upstream/main
# and opens (or updates) a sync PR. It NEVER auto-merges — the PR is for review;
# only then is the runtime pin (DS4_COMMIT) bumped deliberately.
#
# NOTE (fixed 2026-08-26): the schedule-triggered GITHUB_TOKEN is read-only for
# pull-requests, so creating the PR from the cron requires a PAT. Set a classic
# PAT with `repo` scope as the SYNC_TOKEN secret. If SYNC_TOKEN is absent, the
# workflow falls back to GITHUB_TOKEN (works on manual dispatch, not cron).

on:
  schedule:
    - cron: '30 4 * * 0,3'        # 04:30 UTC Wed + Sun (~22:30 MT)
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/antirez/ds4.git
          git fetch upstream main

      - name: Compute divergence
        id: div
        run: |
          echo "behind=$(git rev-list --count main..upstream/main)" >> "$GITHUB_OUTPUT"
          git log --oneline main..upstream/main -n 8 | sed 's/^/  /' > /tmp/log.txt
          { printf '```\n'; cat /tmp/log.txt; printf '```\n'; } > /tmp/body.txt

      - name: Open / update sync PR (never auto-merge)
        if: steps.div.outputs.behind > '0'
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # checkout@v4 sets no git identity, so a merge commit would fail with
          # "Committer identity unknown". Set it explicitly before merging.
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BODY=$(cat <<EOF
          Upstream \`antirez/ds4\` is ahead by ${{ steps.div.outputs.behind }} commit(s).
          $(cat /tmp/body.txt)
          ---
          This PR is **not auto-merged**. Review it, then bump the runtime pin
          (\`DS4_COMMIT\`) deliberately. Any conflicts must be resolved by hand.
          EOF
          )

          git checkout -b sync/upstream upstream/main 2>/dev/null || git checkout sync/upstream 2>/dev/null
          # Make sure the branch tracks origin (not upstream/main) so gh resolves
          # the head repo to this fork and not antirez/ds4.
          git branch --set-upstream-to=origin/sync/upstream sync/upstream 2>/dev/null || true

          if git merge --no-edit origin/main 2>/tmp/merge.err; then
            echo "merge ok"
          else
            echo "merge failed (will push upstream/main unmerged for review):"
            cat /tmp/merge.err
            git merge --abort 2>/dev/null || true
          fi

          git push -f origin sync/upstream

          # Prefer a PAT (works on cron); fall back to GITHUB_TOKEN (dispatch only).
          export GH_TOKEN="${GH_TOKEN:-$GITHUB_TOKEN}"

          # Look up the open sync PR via the REST API (read-only, reliable for the
          # bot token; gh pr list --head can miss it).
          N=$(gh api -q '.[0].number' "/repos/babyLegionite/ds4/pulls?head=sync/upstream&state=open" 2>/dev/null)
          if [ -z "$N" ]; then
            if ! gh pr create --repo babyLegionite/ds4 --base main --head sync/upstream \
              --title "sync: upstream antirez/ds4" --body "$BODY" 2>/tmp/pr.err; then
              echo "::warning::PR creation failed (branch sync/upstream IS pushed): $(cat /tmp/pr.err)"
              echo "::warning::Add a classic PAT with 'repo' scope as the SYNC_TOKEN secret to auto-create the PR from cron."
            fi
          else
            gh pr comment "$N" --body "$BODY" 2>/tmp/pr.err || \
              echo "::warning::PR comment failed: $(cat /tmp/pr.err)"
          fi
